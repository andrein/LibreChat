name: OBO token exchange image

on:
  workflow_dispatch:
  push:
    branches:
      - obo-image

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        run: |
          printf 'IMAGE=ghcr.io/%s/librechat\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          printf 'SHORT_SHA=%s\n' "${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:v0.8.9-rc1-obo-${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:obo
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-obo
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-obo,mode=max
