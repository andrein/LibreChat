name: OBO token exchange image

on:
  workflow_dispatch:
  push:
    branches:
      - obo-image

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG_PREFIX: v0.8.9-rc1-obo

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        run: |
          printf 'IMAGE=ghcr.io/%s/librechat\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          printf 'SHORT_SHA=%s\n' "${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ env.TAG_PREFIX }}-${{ env.SHORT_SHA }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-obo-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-obo-${{ matrix.arch }},mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/librechat"
          tag="${TAG_PREFIX}-${GITHUB_SHA::8}"
          docker buildx imagetools create -t "${image}:${tag}" -t "${image}:obo" \
            "${image}:${tag}-amd64" "${image}:${tag}-arm64"
